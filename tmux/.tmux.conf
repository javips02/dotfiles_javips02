# --- General Settings ---
set -g default-terminal "tmux-256color"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5
set -g extended-keys on

# Use Vim keybindings in copy mode
setw -g mode-keys vi

# --- Keybindings ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# New window in same directory
bind c new-window -c "#{pane_current_path}"

# Better split shortcuts
bind + split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# --- Copy Mode & Mouse Fixes ---
# Stay in copy mode and don't jump to bottom when mouse drag ends
unbind -T copy-mode-vi MouseDragEnd1Pane

# Use 'v' to begin selection and 'y' to yank (like Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- Gruvbox Theme Configuration ---
# Theme plugin must be declared before other plugins so it renders their status-bar content correctly
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark256'
set -g @tmux-gruvbox-left-status-a '#S'
set -g @tmux-gruvbox-right-status-z '#h #{cpu_icon} #{cpu_percentage} #{battery_icon} #{battery_percentage}'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'        # Recommended: Bridges tmux to macOS clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Auto-restore sessions on tmux startup
set -g @continuum-restore 'on'

# Restore Ctrl-l to clear screen
bind C-l send-keys 'C-l'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
