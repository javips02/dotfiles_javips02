# AeroSpace configuration.
config-version = 2

# Commands to run after AeroSpace starts.
after-startup-command = []

# Start AeroSpace at login.
start-at-login = false

# Preserve nested containers so manual horizontal and vertical splits can form
# Fibonacci/spiral layouts.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout defaults.
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Keep the pointer aligned with focus across monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Do not automatically unhide applications hidden by macOS.
automatically-unhide-macos-hidden-apps = false

# Keep numbered workspaces available when empty.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# Commands to run when binding mode changes.
on-mode-changed = []

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 4
outer.bottom = 4
outer.top = 4
outer.right = 4

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

[mode.main.binding]
alt-r = 'mode resize'

# Cycle layouts.
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Manual split and balancing controls.
alt-b = 'split horizontal'
alt-v = 'split vertical'
alt-s = 'split opposite'
alt-0 = 'balance-sizes'

# Focus controls.
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move controls.
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Workspace controls.
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move the focused node to a workspace.
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
