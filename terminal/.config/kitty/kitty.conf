# vim:fileencoding=utf-8:ft=conf

# ── Fonts ────────────────────────────────────────────────────────────────────
font_family       MesloLGM Nerd Font Mono
italic_font       auto
bold_font         auto
bold_italic_font  auto
font_size         13.0

# ── Cursor ───────────────────────────────────────────────────────────────────
shell_integration           no-cursor
cursor_shape                block
cursor_blink_interval       0.5
cursor_stop_blinking_after  15.0

# ── Scrollback ───────────────────────────────────────────────────────────────
scrollback_lines         2000
scrollback_pager         less +G -R
wheel_scroll_multiplier  5.0

# ── Mouse ────────────────────────────────────────────────────────────────────
click_interval             0.5
select_by_word_characters  :@-./_~?&=%+#
mouse_hide_wait            0.0
open_url_modifiers         ctrl+shift
open_url_with              default

# ── Performance ──────────────────────────────────────────────────────────────
repaint_delay  10
input_delay    6

# ── Bell ─────────────────────────────────────────────────────────────────────
visual_bell_duration  0.0
enable_audio_bell     yes

# ── Terminal ─────────────────────────────────────────────────────────────────
term                  xterm-kitty
allow_remote_control  yes

# ── Window ───────────────────────────────────────────────────────────────────
enabled_layouts          *
remember_window_size     no
initial_window_width     1000
initial_window_height    800
window_border_width      0
window_margin_width      15
active_border_color      #ffffff
inactive_border_color    #cccccc
background_opacity       0.8
confirm_os_window_close  0

# ── macOS ────────────────────────────────────────────────────────────────────
hide_window_decorations  titlebar-only
macos_option_as_alt      no
macos_titlebar_color     background

# ── Colors (One Dark Pro) ────────────────────────────────────────────────────
foreground              #ABB2BF
background              #282C34
selection_foreground    #282C34
selection_background    #ABB2BF
cursor                  #ABB2BF
cursor_text_color       #282C34
url_color               #ABB2BF

# Tab bar
active_tab_foreground   #3F4451
active_tab_background   #D7DAE0
inactive_tab_foreground #ABB2BF
inactive_tab_background #282C34

# black
color0  #3F4451
color8  #4F5666
# red
color1  #E06C75
color9  #BE5046
# green
color2  #98C379
color10 #A5E075
# yellow
color3  #D19A66
color11 #E5C07B
# blue
color4  #61AFEF
color12 #4DC4FF
# purple
color5  #C678DD
color13 #DE73FF
# cyan
color6  #56B6C2
color14 #4CD1E0
# white
color7  #D7DAE0
color15 #E6E6E6

# ── Key mappings ─────────────────────────────────────────────────────────────
# Clipboard
map super+v        paste_from_clipboard
map super+c        copy_to_clipboard
map ctrl+shift+s   paste_from_selection
map shift+insert   paste_from_selection

# Scrolling
map ctrl+shift+up         scroll_line_up
map ctrl+shift+down       scroll_line_down
map ctrl+shift+k          scroll_line_up
map ctrl+shift+j          scroll_line_down
map ctrl+shift+page_up    scroll_page_up
map ctrl+shift+page_down  scroll_page_down
map ctrl+shift+home       scroll_home
map ctrl+shift+end        scroll_end
map ctrl+shift+h          show_scrollback

# Windows
map super+n           new_os_window
map super+w           close_window
map ctrl+shift+enter  new_window
map ctrl+shift+]      next_window
map ctrl+shift+[      previous_window
map ctrl+shift+f      move_window_forward
map ctrl+shift+b      move_window_backward
map ctrl+shift+`      move_window_to_top
map ctrl+shift+1      first_window
map ctrl+shift+2      second_window
map ctrl+shift+3      third_window
map ctrl+shift+4      fourth_window
map ctrl+shift+5      fifth_window
map ctrl+shift+6      sixth_window
map ctrl+shift+7      seventh_window
map ctrl+shift+8      eighth_window
map ctrl+shift+9      ninth_window
map ctrl+shift+0      tenth_window

# Tabs
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+q      close_tab
map ctrl+shift+l      next_layout
map ctrl+shift+.      move_tab_forward
map ctrl+shift+,      move_tab_backward

# Font size (moved off ctrl+shift+up/down, which were also bound to scrolling)
map ctrl+shift+equal      increase_font_size
map ctrl+shift+minus      decrease_font_size
map ctrl+shift+backspace  restore_font_size
